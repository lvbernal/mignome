# Generado por ./export.sh — revisa el diff antes de hacer commit.
# @HOME@ se reemplaza por $HOME al cargar.

[org/gnome/desktop/interface]
cursor-theme='Bibata-Modern-Classic'
document-font-name='Atkinson Hyperlegible Next 11'
enable-animations=true
font-antialiasing='rgba'
font-hinting='none'
font-name='Atkinson Hyperlegible Next 11'
font-rendering='manual'
monospace-font-name='Atkinson Hyperlegible Mono 11'
show-battery-percentage=true

[org/gnome/desktop/background]
picture-options='zoom'
picture-uri='file://@HOME@/.config/background'
picture-uri-dark='file://@HOME@/.config/background'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/screensaver]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/mendhak-Bluebells_Suspended_In_Time.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/sound]
event-sounds=true
theme-name='__custom'

[org/gnome/settings-daemon/plugins/color]
night-light-schedule-automatic=false
