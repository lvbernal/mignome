# everforest-dark: Everforest oscuro, contraste medio (paleta de sainnhe/everforest, MIT).
# Acento verde del sistema (Yaru-olive-dark) como base; los colores exactos van en
# gtk-4.0.css, gnome-shell.json, la paleta Everforest de Ptyxis (incluida en Ptyxis)
# y el tema "Everforest Dark" de la extensión de VS Code/Kiro.

[org/gnome/desktop/interface]
accent-color='green'
color-scheme='prefer-dark'
gtk-theme='Yaru-olive-dark'
icon-theme='Yaru-olive-dark'
