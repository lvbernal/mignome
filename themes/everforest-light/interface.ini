# everforest-light: Everforest claro, contraste medio (paleta de sainnhe/everforest, MIT).
# Acento verde del sistema (Yaru-olive) como base; los colores exactos van en
# gtk-4.0.css, gnome-shell.json, la paleta Everforest de Ptyxis (incluida en Ptyxis)
# y el tema "Everforest Light" de la extensión de VS Code/Kiro.

[org/gnome/desktop/interface]
accent-color='green'
color-scheme='prefer-light'
gtk-theme='Yaru-olive'
icon-theme='Yaru-olive'
