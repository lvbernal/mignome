# anniq-dark: tema oscuro. Acento verde del sistema (Yaru-olive-dark) como base;
# los colores exactos van en gtk-4.0.css, la sección [Dark] de Anniq.palette y el
# tema "Anniq Dark" de la extensión de VS Code/Kiro.

[org/gnome/desktop/interface]
accent-color='green'
color-scheme='prefer-dark'
gtk-theme='Yaru-olive-dark'
icon-theme='Yaru-olive-dark'
