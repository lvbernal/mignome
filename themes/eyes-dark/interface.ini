# eyes-dark: tema oscuro pensado para reducir la fatiga visual (paleta propia de mignome).
# Fondo marrón cálido (no negro puro), texto crema a ~11:1 (no blanco puro) y acentos
# apagados de tonos cálidos. Acento marrón del sistema (Yaru-wartybrown-dark) como base;
# los colores exactos van en gtk-4.0.css, gnome-shell.json, EyesDark.palette (Ptyxis)
# y el tema "Eyes Dark" de la extensión de VS Code/Kiro.

[org/gnome/desktop/interface]
accent-color='brown'
color-scheme='prefer-dark'
gtk-theme='Yaru-wartybrown-dark'
icon-theme='Yaru-wartybrown-dark'
